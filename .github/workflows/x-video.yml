name: X video

# One vertical news video a day for X: asks the site for a recent story with a credited photo,
# renders the video (same look as the daily Reel: photo with credit, headline, three points, original
# music) and uploads it to /api/social/x-video, which posts it. Like news-schedule.yml, no secret is
# needed: the run proves its identity with GitHub's OIDC token, and the route only lets in this workflow
# file on the master branch. Nothing is posted when social posting is off, in preview mode (the tweet is
# only written into the log), when X is not set up, or when a video already went out today.
# Run it by hand from the Actions tab to test.

on:
  schedule:
    - cron: '30 13 * * *' # 19:00 IST
  workflow_dispatch:
    inputs:
      test:
        description: 'Test: render the video (with voice) and keep it as a download, post nothing'
        type: boolean
        default: false

concurrency:
  group: x-video
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install fonts and Python packages
        # Pillow and numpy come from apt (system site-packages): run.py starts make_reel.py with
        # `python3 -I`, which ignores the user site where `pip install` puts packages. The first run
        # (22 Nov 2026) failed with "No module named 'PIL'" for that reason.
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-inter ffmpeg python3-pil python3-numpy
          python3 -I -c "import PIL, numpy; print('Pillow', PIL.__version__, 'numpy', numpy.__version__)"
      - name: Render and post the video
        env:
          XVIDEO_TEST: ${{ inputs.test && '1' || '' }}
        run: python3 scripts/x-video/run.py
      - name: Keep the test video
        if: ${{ inputs.test }}
        uses: actions/upload-artifact@v4
        with:
          name: x-video-test
          path: x-video-test.mp4
          if-no-files-found: warn
          retention-days: 3
